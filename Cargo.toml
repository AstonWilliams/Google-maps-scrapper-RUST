[package]
name = "gmaps-scraper-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "rustls-tls", "blocking"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
headless_chrome = "1.0"
url = "2.5"
regex = "1.10"
urlencoding = "2.1"
csv = "1.3"
crossbeam-channel = "0.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.12"
